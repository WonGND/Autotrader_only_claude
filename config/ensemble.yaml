# 규칙 D: 앙상블 추세추종 (Zarattini·Pagani·Barbon 2025 기반) — 실매매 설정
# 2026-10-09 백테스트(2022-05~2026-10): 연 7.4% / MDD -12% / 샤프 0.81 (vol_target 0.25)
# 기준선 B2(터틀 55/20+롱우위)는 실주문 없이 매일 가상으로 같이 계산해 로그에 남긴다.

symbols: [BTC, ETH, BNB, SOL, XRP, DOGE, ADA, AVAX, LINK, DOT]

# ── 봉 크기 (2026-10-09 timeframe_study.py) ──
# 4h: 4시간마다 실행, 룩백은 '봉 개수' → 10~250봉 = 약 2일~42일 보유 (일봉 표준은 10일~8개월)
#   140 USDT, 최소주문 포함 | W1 2025-01~ (횡보·하락 포함) | W2 2026-05~ (추세장)
#   일봉 표준 · 자동1~3배   |  -7.3%/년, MDD -16%          | +12%/년,  MDD -8%
#   4h 표준  · 자동1~3배    |  -4.7%/년, MDD -19%          | +51%/년,  MDD -8%
#   4h 표준  · 자동1~10배(채택, 브레이크 강) | -5.5%/년, MDD -22% | +52%/년, MDD -16%
#   4h 표준  · 고정10배     | -23%/년,  MDD -80%           | +214%/년, MDD -39%   ← 횡보장에서 파산 수준
#   1h 단기  · 고정10배     |      —                       | -67%/년,  MDD -68%   ← 비용(원금의 60%)에 잠식
# 결론: 짧은 봉은 추세장에서 반응이 빨라 유리하지만 횡보장 손실은 줄여주지 못함. 1시간봉 이하는 비용 과다.
timeframe: 4h
bars_history: 2000      # 4h 2000봉 ≈ 333일 (변동성 90일 + 룩백 250봉 + 모델변동성 60일 확보)

lookbacks: [10, 20, 30, 60, 90, 150, 250]   # 각 기간 돌파 신호를 평균 (봉 개수, 종목별 최적화 없음)
vol_target: 0.25        # 종목별 연 변동성 목표. 0.40으로 올리면 수익·낙폭이 함께 약 1.6배
lev_cap: 2.0            # 포트폴리오 총 명목 ≤ 자산 × 2
short_frac: 0.43        # 숏 비중 (롱 1 : 숏 0.43 ≈ 70:30)
short_bear_only: true   # BTC가 200일선 아래일 때만 숏 허용
rebalance_band: 0.20    # 목표와 현재가 20% 이상 차이 날 때만 조정 (거래비용 절감)

# ── 노출 배수 (2026-10-09 레버리지 검토, research/coin_rules_sim/leverage_study.py) ──
# vol_target·lev_cap을 함께 k배. 140 USDT 계좌·최소주문 제약 포함 백테스트:
#   k  | 2022-05~ 연복리 / MDD | 2024~ 연복리 / MDD | 최악의 하루
#   1x |   5.4% / -13%        |  5.3% / -10%       |  -3.7%
#   2x |  10.8% / -26%        |  7.9% / -22%       |  -6.6%   ← 기본값
#   3x |  18.7% / -34%        | 10.8% / -34%       |  -9.9%
#   4x |  29.5% / -42%        | 13.2% / -44%       | -12.7%
#   6x |  34.1% / -57%        | 19.6% / -57%       | -19.9%
#   8x |  34.9% / -70%        | 16.8% / -69%       | -25.3%   (4x 넘으면 수익은 정체, 낙폭만 커짐)
# 켈리 기준: 풀켈리 ≈ 8.9x, 하프켈리 ≈ 4.4x (추정 오차를 감안하면 실전 상한은 하프켈리 이하)
exposure_multiplier: 2   # leverage_mode: fixed 일 때만 사용

# ── 자동 노출 배수 (2026-10-09 adaptive_study.py) ──
# 매일 k = min(변동성기준, 낙폭기준) 을 [k_min, k_max]로 제한해 적용.
#   변동성기준 = portfolio_vol_target ÷ 최근 60일 1배 모델 변동성  (시장이 거칠면 ↓)
#   낙폭기준   = k_max × (1 − 계좌낙폭 ÷ dd_limit)                (계좌가 빠지면 ↓, 회복하면 ↑)
# 파라미터는 2022-05~2023에서만 고르고 2024~에 그대로 적용해 검증 (140 USDT, 최소주문 포함):
#              | 검증 2024~ 연복리 / MDD | 전체 2022-05~ 연복리 / MDD
#   고정 2배   |   7.9% / -21.6%        |  10.8% / -26.1%
#   고정 3배   |  10.8% / -34.0%        |  18.7% / -33.6%
#   자동(이것) |   7.9% / -21.0%        |   9.3% / -19.5%   ← 수익은 고정 2배 수준, 낙폭이 가장 작음
# 자동 조절은 학습 구간에선 크게 좋아 보였지만 검증 구간에선 수익을 늘리지 못했다.
# 기대 효과는 '같은 수익에서 낙폭 축소'이지 '수익 증대'가 아니다.
leverage_mode: auto      # auto | fixed
# 최대 10배 (사용자 결정 2026-10-09). 10배는 시장이 잔잔하고 계좌 낙폭이 없을 때만 도달:
#   계좌 낙폭 7.5%면 최대 5배, 15% 이상이면 1배로 강제 축소 (브레이크 강)
# 이전 값(1~3배: 목표 0.30, 한도 0.20, 최대 3)으로 되돌리면 추세장 수익은 비슷하고 낙폭은 절반.
auto_leverage:
  portfolio_vol_target: 0.60
  dd_limit: 0.15
  k_min: 1.0
  k_max: 10.0
max_gross_exposure: 10   # 어떤 경우에도 총 포지션 명목 ≤ 자산 × 10

# 거래소 레버리지는 종목별 자동 결정: 청산 거리의 70% 안쪽에 비상 손절이 오도록 (최대값만 지정)
# 손익·노출은 위 비중이 결정하고, 이 값은 묶이는 증거금과 청산 거리만 바꾼다.
exchange_leverage_max: 10       # 격리 마진일 때 상한 (청산보다 비상손절이 먼저 오도록 종목별 자동 축소)
exchange_leverage_cross: 20     # 교차 마진일 때 설정값: 총노출 10배에서도 증거금 부족이 없도록
disaster_stop_atr: 3.0  # 거래소에 거는 비상 손절: 현재가 ± 3×일봉ATR (급락 대비, 실행마다 갱신)

# 최소 주문 미달 처리: 목표 금액이 최소 주문의 이 배수 이상이면 최소 수량으로 올려서 주문,
# 미만이면 건너뛰고 로그에 'skip_min_order'로 기록 (과도한 리스크 방지)
min_order_round_up_ratio: 0.6

daily_loss_halt: 0.10   # 24시간 전 대비 자산 -10% 이상이면 신규/증액 중단 (축소·청산은 허용)
shadow_start: "2026-10-10"   # 모델 D·기준선 B2 가상 곡선의 시작일 (실매매 시작일)
