<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoTrader{% endblock %} | 자동 주식 거래 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- 사이드바 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="bi bi-graph-up-arrow text-info"></i>
            <span class="ms-2 fw-bold">AutoTrader</span>
        </div>

        <nav class="sidebar-nav">
            <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i>
                <span>대시보드</span>
            </a>
            <a href="/strategies" class="nav-link {% if '/strategies' in request.url.path %}active{% endif %}">
                <i class="bi bi-diagram-3"></i>
                <span>전략 설정</span>
            </a>
            <a href="/backtest" class="nav-link {% if '/backtest' in request.url.path %}active{% endif %}">
                <i class="bi bi-clock-history"></i>
                <span>백테스트</span>
            </a>
            <a href="/trades" class="nav-link {% if '/trades' in request.url.path %}active{% endif %}">
                <i class="bi bi-list-ul"></i>
                <span>거래 내역</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="trading-status {% if trading_active %}status-active{% else %}status-paused{% endif %}">
                <span class="status-dot"></span>
                {% if trading_active %}자동 매매 실행 중{% else %}자동 매매 중지{% endif %}
            </div>
        </div>
    </div>

    <!-- 메인 콘텐츠 -->
    <div class="main-content">
        <!-- 상단 바 -->
        <div class="topbar">
            <button class="btn btn-sm btn-outline-secondary" id="sidebarToggle">
                <i class="bi bi-list"></i>
            </button>
            <div class="topbar-title">{% block page_title %}{% endblock %}</div>
            <div class="topbar-actions">
                <span class="market-status" id="marketStatus">
                    <span class="status-dot-sm"></span>
                    <span id="marketStatusText">시장 확인 중...</span>
                </span>
                <span class="text-muted small ms-3" id="currentTime"></span>
            </div>
        </div>

        <!-- 페이지 콘텐츠 -->
        <div class="content-area">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script>
        // 사이드바 토글
        document.getElementById('sidebarToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('collapsed');
            document.querySelector('.main-content').classList.toggle('expanded');
        });

        // 현재 시간 표시
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ko-KR', {
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                timeZone: 'Asia/Seoul'
            });
            const dateStr = now.toLocaleDateString('ko-KR', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                timeZone: 'Asia/Seoul'
            });
            document.getElementById('currentTime').textContent = dateStr + ' ' + timeStr;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // 시장 상태 확인
        function checkMarketStatus() {
            const now = new Date();
            const kstOffset = 9 * 60;
            const utc = now.getTime() + now.getTimezoneOffset() * 60000;
            const kst = new Date(utc + kstOffset * 60000);
            const hours = kst.getHours();
            const minutes = kst.getMinutes();
            const day = kst.getDay();
            const timeNum = hours * 100 + minutes;
            const isWeekday = day >= 1 && day <= 5;
            const isMarketHours = timeNum >= 900 && timeNum <= 1530;
            const isOpen = isWeekday && isMarketHours;

            const el = document.getElementById('marketStatus');
            const textEl = document.getElementById('marketStatusText');
            if (isOpen) {
                el.className = 'market-status market-open';
                textEl.textContent = '장 중';
            } else {
                el.className = 'market-status market-closed';
                textEl.textContent = '장 마감';
            }
        }
        checkMarketStatus();
        setInterval(checkMarketStatus, 60000);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
